[package]
name = "geek_storage"
description = "Superfast caching server for GEEK Music"
version = "1.0.1"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
chrono = "0.4.44"
dotenv = "0.15.0"
hex = "0.4.3"
rand = "0.10.0"
reflink = "0.1.3"
reqwest = "0.13.2"
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
tower-http = { version = "0.6.8", features = ["cors", "compression-full"] }
