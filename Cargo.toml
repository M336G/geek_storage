[package]
name = "geek_storage"
description = "Superfast caching server for GEEK Music"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
chrono = "0.4.45"
dashmap = "6.2.1"
dotenv = "0.15.0"
hex = "0.4.3"
rand = "0.10.2"
reflink = "0.1.3"
reqwest = "0.13.4"
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.0", features = ["cors", "compression-full"] }
