[package]
name = "geek_storage"
description = "Superfast caching server for GEEK Music"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
chrono = "0.4.45"
dashmap = "6.2.1"
dotenv = "0.15.0"
essi-ffmpeg = "0.3.0"
hex = "0.4.3"
infer = "0.22.0"
rand = "0.10.3"
reflink = "0.1.3"
reqwest = "0.13.5"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["cors", "compression-full"] }
